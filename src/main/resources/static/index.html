<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <title>STOMP 1:1 Chat Test</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        input { margin: 0 8px; }
        pre { background: #f0f0f0; padding: 10px; height: 200px; overflow: auto; }
    </style>
</head>
<body>
<h2>STOMP 1:1 Chat Test</h2>

<!-- URL 파라미터에서 user 값을 읽어 자동 설정 -->
<script>
    const params = new URLSearchParams(window.location.search);
    const userParam = params.get('user') || '';
</script>

<div>
    <label>내 이름:
        <input id="username" value="" readonly style="background:#eee;" />
    </label>
    <button id="connect">Connect</button>
    <button id="disconnect" disabled>Disconnect</button>
</div>
<hr/>

<div>
    <label>받는 사람: <input id="toUser" value="" /></label>
    <label>메시지: <input id="msgText" value="안녕하세요!" style="width:200px;" /></label>
    <button id="send" disabled>Send</button>
</div>
<hr/>

<pre id="log"></pre>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
<script>
    // 초기 사용자 이름 세팅
    const usernameInput = document.getElementById('username');
    usernameInput.value = userParam;

    let stompClient = null;
    const logEl = document.getElementById('log');
    function appendLine(text) {
      logEl.textContent += text + '\n';
      logEl.scrollTop = logEl.scrollHeight;
    }

    document.getElementById('connect').onclick = () => {
      const user = usernameInput.value.trim();
      if (!user) return alert('URL ?user=alice 형식으로 사용자 이름을 지정하세요.');

      // Handshake 단계에서 query param 으로 넘겨줘야 서버측 Principal 설정이 작동합니다
      const socket = new SockJS(`/ws-chat?user=${encodeURIComponent(user)}`);
      stompClient = Stomp.over(socket);

      stompClient.connect({}, frame => {
        appendLine(`[CONNECTED as ${user}]`);
        document.getElementById('connect').disabled = true;
        document.getElementById('disconnect').disabled = false;
        document.getElementById('send').disabled = false;

        // 1:1 메시지 구독
        stompClient.subscribe('/user/queue/messages', msg => {
          const body = JSON.parse(msg.body);
          appendLine(`[RECEIVED] from=${body.from} text=${body.text}`);
        });
      }, error => {
        appendLine(`[ERROR] ${error}`);
      });
    };

    document.getElementById('disconnect').onclick = () => {
      if (stompClient) {
        stompClient.disconnect(() => {
          appendLine('[DISCONNECTED]');
          document.getElementById('connect').disabled = false;
          document.getElementById('disconnect').disabled = true;
          document.getElementById('send').disabled = true;
        });
      }
    };

    document.getElementById('send').onclick = () => {
      const from = usernameInput.value.trim();
      const to   = document.getElementById('toUser').value.trim();
      const text = document.getElementById('msgText').value.trim();
      if (!to || !text) return alert('받는 사람과 메시지를 입력하세요.');

      stompClient.send(
        '/app/chat.send',
        {},
        JSON.stringify({ from, to, text })
      );
      appendLine(`[SENT] to=${to} text=${text}`);
    };
</script>
</body>
</html>
